name: orderforge

services:
    orders-db:
        image: postgres:18.6-alpine3.24
        environment:
            POSTGRES_DB: orderforge_orders
            POSTGRES_USER: orderforge_orders
            POSTGRES_PASSWORD: "${ORDERS_DB_PASSWORD}"
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - orders-db-data:/var/lib/postgresql
        healthcheck:
              test: ["CMD-SHELL", "pg_isready -U orderforge_orders -d orderforge_orders"]
              interval: 5s
              timeout: 5s
              retries: 10
              start_period: 10s
    inventory-db:
          image: postgres:18.6-alpine3.24
          environment:
              POSTGRES_DB: orderforge_inventory
              POSTGRES_USER: orderforge_inventory
              POSTGRES_PASSWORD: "${INVENTORY_DB_PASSWORD}"
          ports:
              - "127.0.0.1:5433:5432"
          volumes:
              - inventory-db-data:/var/lib/postgresql
          healthcheck:
              test: ["CMD-SHELL", "pg_isready -U orderforge_inventory -d orderforge_inventory"]
              interval: 5s
              timeout: 5s
              retries: 10
              start_period: 10s
    payments-db:
          image: postgres:18.6-alpine3.24
          environment:
              POSTGRES_DB: orderforge_payments
              POSTGRES_USER: orderforge_payments
              POSTGRES_PASSWORD: "${PAYMENTS_DB_PASSWORD}"
          ports:
              - "127.0.0.1:5434:5432"
          volumes:
              - payments-db-data:/var/lib/postgresql
          healthcheck:
              test: ["CMD-SHELL", "pg_isready -U orderforge_payments -d orderforge_payments"]
              interval: 5s
              timeout: 5s
              retries: 10
              start_period: 10s
    rabbitmq:
          image: rabbitmq:4.3.5-management
          environment:
              RABBITMQ_DEFAULT_USER: orderforge
              RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
              RABBITMQ_DEFAULT_VHOST: orderforge
          ports:
              - "127.0.0.1:5672:5672"
              - "127.0.0.1:15672:15672"
          volumes:
              - rabbitmq-data:/var/lib/rabbitmq
          healthcheck:
              test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
              interval: 5s
              timeout: 5s
              retries: 10
              start_period: 20s
    kafka:
          image: apache/kafka:4.3.1
          hostname: kafka
          environment:
              KAFKA_NODE_ID: "1"
              KAFKA_PROCESS_ROLES: broker,controller
              KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
              KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
              KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
              KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
              KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
              KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
              CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
              KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
              KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
              KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
              KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
              KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
              KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
              KAFKA_NUM_PARTITIONS: "3"
              KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
              KAFKA_LOG_DIRS: /var/lib/kafka/data
          ports:
              - "127.0.0.1:9092:9092"
          volumes:
              - kafka-data:/var/lib/kafka/data
          healthcheck:
              test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
              interval: 10s
              timeout: 5s
              retries: 10
              start_period: 30s
          stop_grace_period: 30s
volumes:
    orders-db-data:
    inventory-db-data:
    payments-db-data:
    rabbitmq-data:
    kafka-data: